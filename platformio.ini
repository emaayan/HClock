;  PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp32

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200 
check_skip_packages = true
; build_src_filter= +<*.h> +<main-${PIOENV}.cpp>

#build_type = debug
debug_build_flags =
	-O0 
	-Og  
	-DDEBUG_CON		 
extra_scripts = pre:pre_build.py
lib_deps = 
	adafruit/RTClib@^2.1.1	
	adafruit/Adafruit BusIO @ ^1.14.1
	SPI
	mathertel/OneButton@^2.0.3		
	; https://werner.rothschopf.net/microcontroller/images/lcd/NoiascaLiquidCrystal.zip@^2.1.4		
	marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
	olikraus/U8g2 @ ^2.36.18	; >=2.36 required for the SSD1363 (2.7") driver
	; https://github.com/emaayan/libzmanim.git			
	
	
	; https://github.com/davetcc/tcMenuLib.git@^3.1.0
	; https://github.com/davetcc/IoAbstraction.git@^3.1.0
	; https://github.com/davetcc/tcUnicodeHelper.git@^0.3.0

	
	; Owner renamed davetcc/* -> tcmenu/* (old versions not carried over; oldest now 4.4.0 / 1.2.1)
	tcmenu/tcMenu @ ^4.4.0
	tcmenu/IoAbstraction @ ^4.4.0
	tcmenu/tcUnicodeHelper @ ^1.2.1
	bblanchon/ArduinoJson @ ^6.21.2	
	
lib_extra_dirs=
	 ${PROJECT_DIR}/../ext_libs


[env:nano]
platform = atmelavr
board = nanoatmega328new

monitor_port = COM6
upload_port = COM6
debug_port = \\.\COM6
; build_type = debug
; build_src_filter= +<*.h> +<main-esp32.cpp>
build_flags= 
	-O2
	-D RED_BUTTON=4
	-D GREEN_BUTTON=7
	-D BLUE_BUTTON=8
	-D BRIGHTNESS_PIN=6
	-D PULL_UP=false
	-D DISPSECS


[env:esp32]
build_type = debug
platform = espressif32
board = esp32dev
build_src_filter= +<*.h> +<HClock_main.cpp> +<generated/HClock_menu.cpp> +<generated/tcMenuU8g2.cpp> 
monitor_filters = esp32_exception_decoder
monitor_speed = 115200 
monitor_port = COM3
upload_port = COM3

; upload_port = COM12
; upload_speed=921000
; upload_protocol=esp-prog
; debug_tool = esp-prog
; debug_init_break = tbreak setup
debug_build_flags =
	-O0 
	-Og  
	-ggdb3 
	-g2
	-DDEBUG_CON		 
build_flags= 	
	-O2
	-D RED_BUTTON=27
	-D GREEN_BUTTON=25
	-D BLUE_BUTTON=26
	-D BRIGHTNESS_PIN=33
	-D PULL_UP=true	 
	-D STD_C
; 	                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             