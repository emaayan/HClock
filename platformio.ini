                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      n-D CORE_DEBUG_LEVEL=5
extra_scripts = ./littlefsbuilder.py	
	
; Same ESP32 board/wiring as [env:esp32], but drives the 2.7" 256x128 (SSD1363)
; screen instead of the 2.42" 128x64 (SSD1309). Build with: pio run -e esp32_270
[env:esp32_270]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -D DISPLAY_SSD1363

; 3.5" 480x320 SPI TFT (ILI9488) + XPT2046 touch on the perfboard ESP32.
; Shows the same 256x128 layout as esp32_270, scaled to the TFT (src/U8g2Tft.*).
; Pins match TFTTouchTest / docs/perfboard_layout.png. Build with: pio run -e esp32_tft
[env:esp32_tft]
extends = env:esp32
monitor_port = COM11
upload_port = COM11
build_src_filter = ${env:esp32.build_src_filter} +<U8g2Tft.cpp>
lib_deps =
	${env.lib_deps}
	bodmer/TFT_eSPI @ ^2.5.43
build_flags = ${env:esp32.build_flags}
	-D DISPLAY_TFT
	-D PIN_BL=32
	-D TFT_ROTATION=3 ; 180° in the enclosure (USB at the top); 1 = the original orientation
	-D USER_SETUP_LOADED=1
	-D ILI9488_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_SCLK=18
	-D TFT_MOSI=23
	-D TFT_MISO=19
	-D TFT_CS=5
	-D TFT_DC=17
	-D TFT_RST=16
	-D TOUCH_CS=14
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=16000000
	-D SPI_TOUCH_FREQUENCY=2500000

; Native TFT face (design: HClock TFT Face mockup) drawn with TFT_eSPI + Assistant
; smooth fonts (src/native), with touch. The menu is generated from HClockTFT.emf
; (TFT_eSPI renderer + touch); the U8g2 wrapper only shows the boot messages.
; esp32_tft stays as the fallback. Build with: pio run -e esp32_tft_native
[env:esp32_tft_native]
extends = env:esp32_tft
build_src_filter = +<*.h> +<HClock_main.cpp> +<U8g2Tft.cpp> +<native/*.cpp> +<generated/HClockTFT_menu.cpp> +<generated/tcMenuTfteSpi.cpp>
build_flags = ${env:esp32_tft.build_flags}
	-D DISPLAY_TFT_NATIVE
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D NIGHT_BACKLIGHT=40

[env:esp32basic]
platform = espressif32
board = esp32dev
build_src_filter= +<*.h> +<main${PIOENV}.cpp>
board_build.partitions = partitions_custom.csv
monitor_filters = esp32_exception_decoder
; board_build.filesystem = littlefs
monitor_speed = 115200
monitor_port = COM6
upload_port = COM6
; upload_port = COM7
; upload_speed=921000
; upload_protocol=esp-prog
; debug_tool = esp-prog
; debug_init_break = tbreak setup